<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Abastecimentos - 2ª Cia PM</title>

    <!-- BULMA -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>
        :root {

            --pm-blue-dark: #002147;
            --pm-blue-light: #003366;
            --pm-gray: #333333;
            --bg-body: #f5f7fa;
            --pm-gold: #ccaa00;

        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background-color:
                var(--bg-body);

            color: #1e293b;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

        }


        /* ==================================================
           CABEÇALHO
        ================================================== */

        .hero.is-pm {

            background-color:
                var(--pm-blue-dark);

            color: white;

            border-bottom:
                4px solid var(--pm-gold);

        }


        .hero-body-custom {

            padding:
                1.5rem 1rem 0 !important;

        }


        .titulo-principal {

            margin-bottom:
                1.5rem !important;

            text-align: center;

        }


        /* ==================================================
           ABAS
        ================================================== */

        .tabs-container {

            max-width: 900px;

            margin: 0 auto;

        }


        .tabs-custom {

            margin-bottom:
                0 !important;

        }


        .tabs-custom ul {

            border-bottom: none;

            display: flex;

            width: 100%;

        }


        .tabs-custom li {

            flex: 1;

        }


        .tabs-custom a {

            justify-content: center;

            color:
                rgba(255, 255, 255, .75);

            border: none !important;

            border-radius:
                8px 8px 0 0;

            font-weight: bold;

            padding:
                14px 10px;

            transition: .2s;

        }


        .tabs-custom a:hover {

            color: white;

            background:
                rgba(255, 255, 255, .08);

        }


        .tabs-custom li.is-active a {

            color:
                var(--pm-blue-dark);

            background: white;

        }


        /* ==================================================
           CONTAINER
        ================================================== */

        .conteudo-principal {

            max-width: 900px;

            margin: 0 auto;

        }


        .box-custom {

            border-radius: 8px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, .1);

            margin-top: 1.5rem;

            background: #ffffff;

        }


        .aba-conteudo {

            display: none;

        }


        .aba-conteudo.ativa {

            display: block;

        }


        /* ==================================================
           FORMULÁRIO
        ================================================== */

        .label {

            color:
                var(--pm-gray);

            text-transform:
                uppercase;

            font-size: .85rem;

            letter-spacing: .5px;

        }


        .button.is-pm-send {

            background-color:
                var(--pm-blue-dark);

            color: white;

            font-weight: bold;

        }


        .button.is-pm-send:hover {

            background-color:
                var(--pm-blue-light);

            color: white;

        }


        /* ==================================================
           PREVIEW
        ================================================== */

        #preview-container {

            display: none;

            margin-top: 15px;

            border:
                2px solid #dbdbdb;

            border-radius: 6px;

            padding: 8px;

            background: #fafafa;

            position: relative;

        }


        #image-preview {

            width: 100%;

            border-radius: 4px;

            display: block;

        }


        .btn-remove {

            position: absolute;

            top: -10px;

            right: -10px;

            background: #d32f2f;

            color: white;

            border: none;

            border-radius: 50%;

            width: 28px;

            height: 28px;

            cursor: pointer;

            font-weight: bold;

            z-index: 5;

        }


        /* ==================================================
           MENSAGEM
        ================================================== */

        #message {

            display: none;

            position: fixed;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 1000;

            min-width: 300px;

            max-width: 90%;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .2);

            border-radius: 12px;

            font-weight: bold;

        }


        .msg-overlay {

            display: none;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(0, 0, 0, .4);

            z-index: 999;

        }


        /* ==================================================
           CONSULTA
        ================================================== */

        .consulta-campo {

            display: flex;

            gap: 10px;

            align-items: center;

        }


        .consulta-campo .select {

            flex: 1;

        }


        .consulta-campo select {

            width: 100%;

        }


        #status {

            margin-top: 15px;

            color: #64748b;

        }


        .resultado {

            margin-top: 25px;

        }


        /* ==================================================
           CARDS DOS RESULTADOS
        ================================================== */

        .registro {

            display: grid;

            grid-template-columns:
                130px minmax(200px, 1fr) 190px 130px;

            grid-template-areas:
                "viatura obs data imagem";

            gap: 18px;

            align-items: center;

            padding: 16px 18px;

            margin-bottom: 12px;

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-left:
                4px solid var(--pm-blue-dark);

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .05);

            transition:
                transform .2s,
                box-shadow .2s;

        }


        .registro:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, .08);

        }


        /* ==================================================
           ÁREAS DO CARD
        ================================================== */

        .registro .campo-viatura {

            grid-area: viatura;

        }


        .registro .campo-obs {

            grid-area: obs;

            min-width: 0;

        }


        .registro .campo-data {

            grid-area: data;

        }


        .registro .campo-imagem {

            grid-area: imagem;

            display: flex;

            justify-content: flex-end;

            align-items: center;

        }


        /* ==================================================
           LABELS DO CARD
        ================================================== */

        .registro .label {

            display: block;

            color: #64748b;

            font-size: 11px;

            font-weight: 700;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: .5px;

        }


        /* ==================================================
           VALORES DO CARD
        ================================================== */

        .registro .valor {

            color: #1e293b;

            font-size: 14px;

            line-height: 1.4;

            word-break: break-word;

        }


        .registro .valor.data {

            font-weight: 700;

            color:
                var(--pm-blue-dark);

            white-space: nowrap;

        }


        /* ==================================================
           MINIATURA
        ================================================== */

        .registro .thumb {

            width: 110px;

            height: 82px;

            object-fit: cover;

            border-radius: 8px;

            border:
                1px solid #cbd5e1;

            cursor: pointer;

            transition:
                transform .2s,
                box-shadow .2s;

            background: #e2e8f0;

        }


        .registro .thumb:hover {

            transform:
                scale(1.05);

            box-shadow:
                0 4px 12px rgba(0, 0, 0, .18);

        }


        .registro .sem-imagem {

            color: #94a3b8;

            font-size: 12px;

        }


        /* ==================================================
           NENHUM RESULTADO
        ================================================== */

        .nenhum {

            text-align: center;

            padding: 40px 10px;

            color: #64748b;

        }


        /* ==================================================
           MODAL DA IMAGEM
        ================================================== */

        .modal-imagem {

            display: none;

            position: fixed;

            z-index: 9999;

            inset: 0;

            background:
                rgba(0, 0, 0, .85);

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .modal-imagem.aberto {

            display: flex;

        }


        .modal-imagem img {

            max-width: 95vw;

            max-height: 90vh;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, .5);

        }


        .fechar {

            position: fixed;

            top: 15px;

            right: 25px;

            width: 45px;

            height: 45px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, .2);

            color: white;

            font-size: 30px;

            line-height: 45px;

            text-align: center;

            cursor: pointer;

            z-index: 10000;

        }


        /* ==================================================
           RESPONSIVO - TABLET / CELULAR
        ================================================== */

        @media (max-width: 768px) {

            .hero-body-custom {

                padding:
                    1.5rem 1rem 0 !important;

            }


            .titulo-principal {

                font-size:
                    1.5rem !important;

            }


            .tabs-custom a {

                font-size: .85rem;

                padding:
                    12px 5px;

            }


            .consulta-campo {

                flex-direction: column;

            }


            .consulta-campo .select,
            .consulta-campo button {

                width: 100%;

            }


            /* ==========================================
               CARD
            ========================================== */

            .registro {

                grid-template-columns:
                    1fr 1fr;

                grid-template-areas:

                    "viatura data"

                    "obs obs"

                    "imagem imagem";

                gap: 14px;

                padding: 16px;

                border-left:
                    4px solid var(--pm-blue-dark);

            }


            .registro .campo-data {

                text-align: right;

            }


            .registro .valor.data {

                white-space: normal;

                font-size: 13px;

            }


            .registro .campo-obs {

                padding-top: 10px;

                border-top:
                    1px solid #e2e8f0;

            }


            .registro .campo-imagem {

                justify-content:
                    flex-start;

                padding-top: 10px;

                border-top:
                    1px solid #e2e8f0;

            }


            .registro .thumb {

                width: 150px;

                height: 110px;

            }

        }


        /* ==================================================
           CELULAR PEQUENO
        ================================================== */

        @media (max-width: 450px) {

            .tabs-custom a {

                font-size: .75rem;

            }


            .tabs-custom a i {

                display: block;

                margin-right: 0 !important;

                margin-bottom: 4px;

            }


            .registro {

                grid-template-columns: 1fr;

                grid-template-areas:

                    "viatura"

                    "data"

                    "obs"

                    "imagem";

                gap: 10px;

            }


            .registro .campo-data {

                text-align: left;

            }


            .registro .campo-obs {

                padding-top: 10px;

            }


            .registro .campo-imagem {

                justify-content:
                    flex-start;

                padding-top: 10px;

            }


            .registro .thumb {

                width: 100%;

                max-width: 240px;

                height: 160px;

            }

        }
    </style>

</head>


<body>


    <!-- ==================================================
         MENSAGEM
    ================================================== -->

    <div id="overlay" class="msg-overlay"></div>

    <div id="message" class="notification"></div>


    <!-- ==================================================
         CABEÇALHO + ABAS
    ================================================== -->

    <section class="hero is-pm">

        <div class="hero-body hero-body-custom">

            <div class="container">

                <h1 class="title has-text-white titulo-principal">

                    <i class="fas fa-shield-halved mr-2"></i>

                    2ª CIA - Abastecimentos

                </h1>


                <div class="tabs tabs-custom">

                    <ul>

                        <li id="tabRegistrar" class="is-active">

                            <a href="#" onclick="mostrarAba('registrar', event)">

                                <i class="fas fa-gas-pump mr-2"></i>

                                Registrar

                            </a>

                        </li>


                        <li id="tabConsultar">

                            <a href="#" onclick="mostrarAba('consultar', event)">

                                <i class="fas fa-magnifying-glass mr-2"></i>

                                Consultar

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </section>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="container conteudo-principal px-4">


        <!-- ==================================================
             ABA REGISTRAR
        ================================================== -->

        <section id="abaRegistrar" class="aba-conteudo ativa">

            <form id="form" class="box box-custom p-5">


                <!-- DATA -->

                <div class="field">

                    <label class="label">

                        <i class="fas fa-calendar-alt mr-1"></i>

                        Data da Ocorrência

                    </label>


                    <div class="control has-icons-left">

                        <input class="input" type="date" name="Data" id="dataAtual" required>


                        <span class="icon is-small is-left">

                            <i class="fas fa-calendar"></i>

                        </span>

                    </div>

                </div>


                <!-- VIATURA -->

                <div class="field">

                    <label class="label">

                        <i class="fas fa-car-side mr-1"></i>

                        Prefixo da Viatura

                    </label>


                    <div class="control has-icons-left">

                        <div class="select is-fullwidth">

                            <select name="Viatura" id="viaturaSelect" required>

                                <option value="">
                                    Carregando viaturas...
                                </option>

                            </select>

                        </div>


                        <span class="icon is-small is-left">

                            <i class="fas fa-hashtag"></i>

                        </span>

                    </div>

                </div>


                <!-- FOTO -->

                <div class="field">

                    <label class="label">

                        <i class="fas fa-camera mr-1"></i>

                        Foto da Nota Fiscal

                    </label>


                    <div class="control">

                        <div class="file has-name is-fullwidth is-dark">

                            <label class="file-label">

                                <input class="file-input" type="file" name="Nota" id="fileInput" accept="*/*" required>


                                <span class="file-cta">

                                    <span class="file-icon">

                                        <i class="fas fa-camera"></i>

                                    </span>


                                    <span class="file-label">

                                        Tirar Foto da Nota

                                    </span>

                                </span>


                                <span class="file-name" id="fileNameDisplay">

                                    Nenhum arquivo capturado

                                </span>

                            </label>

                        </div>

                    </div>


                    <div id="preview-container">

                        <button type="button" class="btn-remove" id="removeBtn">

                            &times;

                        </button>


                        <img src="" id="image-preview" alt="Preview">

                    </div>

                </div>


                <!-- OBSERVAÇÃO -->

                <div class="field">

                    <label class="label">

                        <i class="fas fa-comment-alt mr-1"></i>

                        Observações

                    </label>


                    <div class="control">

                        <textarea class="textarea" name="Obs" id="Obs"
                            placeholder="Anomalias, erros na bomba, etc."></textarea>

                    </div>

                </div>


                <!-- BOTÕES -->

                <div class="field is-grouped pt-4">

                    <div class="control is-expanded">

                        <button class="button is-pm-send is-fullwidth" type="submit" id="submit-button">

                            <i class="fas fa-paper-plane mr-2"></i>

                            ENVIAR

                        </button>

                    </div>


                    <div class="control is-expanded">

                        <button class="button is-light is-fullwidth" type="button" onclick="resetForm()">

                            LIMPAR

                        </button>

                    </div>

                </div>

            </form>

        </section>


        <!-- ==================================================
             ABA CONSULTAR
        ================================================== -->

        <section id="abaConsultar" class="aba-conteudo">

            <div class="box box-custom p-5">

                <h2 class="title is-4">

                    <i class="fas fa-list-check mr-2"></i>

                    Consulta de Abastecimentos

                </h2>


                <div class="consulta-campo">

                    <div class="select is-fullwidth">

                        <select id="viatura">

                            <option value="">
                                Carregando viaturas...
                            </option>

                        </select>

                    </div>


                    <button class="button is-pm-send" type="button" onclick="consultar()">

                        <i class="fas fa-search mr-2"></i>

                        Pesquisar

                    </button>

                </div>


                <div id="status"></div>


                <div id="resultado" class="resultado"></div>

            </div>

        </section>

    </main>


    <!-- ==================================================
         MODAL DA IMAGEM
    ================================================== -->

    <div id="modal" class="modal-imagem" onclick="fecharImagem()">

        <div class="fechar" onclick="fecharImagem()">

            ×

        </div>


        <img id="imagemGrande" src="" alt="Imagem" onclick="event.stopPropagation()">

    </div>


    <script>


        /* ==================================================
           CONFIGURAÇÃO
        ================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbyCQ9crWywcceQU6tz2kkL-hG2bltZvoR6BZWc08rLpc7E4tDR5ubdGhbUWGXwUkaqK/exec";


        /* ==================================================
           ELEMENTOS DO FORMULÁRIO
        ================================================== */

        const form =
            document.getElementById("form");


        const fileInput =
            document.getElementById("fileInput");


        const fileNameDisplay =
            document.getElementById(
                "fileNameDisplay"
            );


        const previewContainer =
            document.getElementById(
                "preview-container"
            );


        const imagePreview =
            document.getElementById(
                "image-preview"
            );


        const messageDiv =
            document.getElementById(
                "message"
            );


        const overlay =
            document.getElementById(
                "overlay"
            );


        const submitBtn =
            document.getElementById(
                "submit-button"
            );


        /* ==================================================
           DATA ATUAL - SÃO PAULO
        ================================================== */

        const hoje =
            new Intl.DateTimeFormat(
                "en-CA",
                {
                    timeZone:
                        "America/Sao_Paulo",

                    year:
                        "numeric",

                    month:
                        "2-digit",

                    day:
                        "2-digit"
                }
            ).format(new Date());


        document.getElementById(
            "dataAtual"
        ).value = hoje;


        /* ==================================================
           CONTROLE DAS ABAS
        ================================================== */

        function mostrarAba(
            aba,
            event
        ) {

            if (event) {

                event.preventDefault();

            }


            const registrar =
                document.getElementById(
                    "abaRegistrar"
                );


            const consultar =
                document.getElementById(
                    "abaConsultar"
                );


            const tabRegistrar =
                document.getElementById(
                    "tabRegistrar"
                );


            const tabConsultar =
                document.getElementById(
                    "tabConsultar"
                );


            if (aba === "registrar") {

                registrar.classList.add(
                    "ativa"
                );


                consultar.classList.remove(
                    "ativa"
                );


                tabRegistrar.classList.add(
                    "is-active"
                );


                tabConsultar.classList.remove(
                    "is-active"
                );

            }
            else {

                registrar.classList.remove(
                    "ativa"
                );


                consultar.classList.add(
                    "ativa"
                );


                tabRegistrar.classList.remove(
                    "is-active"
                );


                tabConsultar.classList.add(
                    "is-active"
                );


                carregarViaturas();

            }

        }


        /* ==================================================
           MENSAGEM
        ================================================== */

        function showStatus(
            text,
            type
        ) {

            messageDiv.textContent =
                text;


            messageDiv.className =
                `notification ${type}`;


            messageDiv.style.display =
                "block";


            overlay.style.display =
                "block";


            if (
                type === "is-success" ||
                type === "is-danger"
            ) {

                setTimeout(
                    () => {

                        messageDiv.style.display =
                            "none";


                        overlay.style.display =
                            "none";

                    },
                    3000
                );

            }

        }


        /* ==================================================
           PREVIEW DA FOTO
        ================================================== */

        fileInput.addEventListener(
            "change",
            function () {

                if (
                    this.files &&
                    this.files[0]
                ) {

                    fileNameDisplay.textContent =
                        this.files[0].name;


                    const reader =
                        new FileReader();


                    reader.onload =
                        (e) => {

                            imagePreview.src =
                                e.target.result;


                            previewContainer.style.display =
                                "block";

                        };


                    reader.readAsDataURL(
                        this.files[0]
                    );

                }

            }
        );


        /* ==================================================
           BOTÃO REMOVER FOTO
        ================================================== */

        document
            .getElementById("removeBtn")
            .addEventListener(
                "click",
                function () {

                    fileInput.value = "";

                    imagePreview.src = "";

                    previewContainer.style.display =
                        "none";

                    fileNameDisplay.textContent =
                        "Nenhum arquivo capturado";

                }
            );


        /* ==================================================
           RESET FORM
        ================================================== */

        function resetForm() {

            form.reset();


            document.getElementById(
                "dataAtual"
            ).value = hoje;


            previewContainer.style.display =
                "none";


            imagePreview.src =
                "";


            fileNameDisplay.textContent =
                "Nenhum arquivo capturado";


            messageDiv.style.display =
                "none";


            overlay.style.display =
                "none";

        }


        /* ==================================================
           PROCESSAMENTO DA IMAGEM
        ================================================== */

        async function processImage(
            file,
            viatura,
            dataOcorrencia
        ) {

            return new Promise(
                (resolve, reject) => {

                    const img =
                        new Image();


                    const reader =
                        new FileReader();


                    reader.onload =
                        (e) => {

                            img.src =
                                e.target.result;

                        };


                    img.onerror =
                        () => {

                            reject(
                                new Error(
                                    "Não foi possível processar a imagem."
                                )
                            );

                        };


                    img.onload =
                        () => {

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            const MAX_WIDTH =
                                1000;


                            let width =
                                img.width;


                            let height =
                                img.height;


                            if (
                                width >
                                MAX_WIDTH
                            ) {

                                height *=
                                    MAX_WIDTH /
                                    width;

                                width =
                                    MAX_WIDTH;

                            }


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            /* ==========================================
                               VIATURA
                            ========================================== */

                            let vtr =
                                document
                                    .getElementById(
                                        "viaturaSelect"
                                    )
                                    .value;


                            const obs =
                                document
                                    .getElementById(
                                        "Obs"
                                    )
                                    .value;


                            if (
                                vtr.toLowerCase() ===
                                "outra"
                            ) {

                                vtr =
                                    obs
                                        ? obs
                                        : "Outra";

                            }


                            /* ==========================================
                               HORA
                            ========================================== */

                            const agora =
                                new Date();


                            const horas =
                                String(
                                    agora.getHours()
                                ).padStart(
                                    2,
                                    "0"
                                );


                            const minutos =
                                String(
                                    agora.getMinutes()
                                ).padStart(
                                    2,
                                    "0"
                                );


                            /* ==========================================
                               NOME DO ARQUIVO
                            ========================================== */

                            const customFileName =
                                `${dataOcorrencia}_${horas}-${minutos}_VTR-${vtr}.jpg`;


                            /* ==========================================
                               DATA FORMATADA
                            ========================================== */

                            function formatarData(
                                dataISO
                            ) {

                                const [
                                    ano,
                                    mes,
                                    dia
                                ] =
                                    dataISO.split("-");


                                return `${dia}-${mes}-${ano}`;

                            }


                            /* ==========================================
                               MARCA D'ÁGUA
                            ========================================== */

                            const textoMarca =
                                `VTR: ${vtr} | ${formatarData(dataOcorrencia)} ${horas}:${minutos}`;


                            ctx.fillStyle =
                                "rgba(0, 0, 0, 0.6)";


                            ctx.fillRect(
                                0,
                                height - 40,
                                width,
                                40
                            );


                            ctx.font =
                                "bold 20px Arial";


                            ctx.fillStyle =
                                "white";


                            ctx.fillText(
                                textoMarca,
                                20,
                                height - 12
                            );


                            /* ==========================================
                               RETORNA
                            ========================================== */

                            resolve({

                                fileName:
                                    customFileName,

                                data:
                                    canvas
                                        .toDataURL(
                                            "image/jpeg",
                                            0.85
                                        )
                                        .split(",")[1]

                            });

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        /* ==================================================
           ENVIO DO FORMULÁRIO
        ================================================== */

        form.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                submitBtn.disabled =
                    true;


                submitBtn.classList.add(
                    "is-loading"
                );


                showStatus(
                    "🚀 Enviando dados para o sistema... Aguarde.",
                    "is-warning is-light"
                );


                try {

                    const formData =
                        new FormData(this);


                    const obj =
                        Object.fromEntries(
                            formData.entries()
                        );


                    if (
                        fileInput.files.length >
                        0
                    ) {

                        obj.fileData =
                            await processImage(
                                fileInput.files[0],
                                obj.Viatura,
                                obj.Data
                            );

                    }


                    const response =
                        await fetch(
                            API_URL,
                            {
                                method:
                                    "POST",

                                body:
                                    JSON.stringify(
                                        obj
                                    ),

                                headers: {
                                    "Content-Type":
                                        "text/plain;charset=utf-8"
                                }
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        result.status ===
                        "success"
                    ) {

                        showStatus(
                            "✅ Abastecimento registrado com sucesso!",
                            "is-success"
                        );


                        setTimeout(
                            () => {

                                resetForm();

                            },
                            2500
                        );

                    }
                    else {

                        throw new Error(
                            "Erro no servidor"
                        );

                    }

                }
                catch (error) {

                    console.error(
                        error
                    );


                    showStatus(
                        "❌ Erro ao enviar. Tente novamente ou verifique a conexão.",
                        "is-danger"
                    );

                }
                finally {

                    submitBtn.disabled =
                        false;


                    submitBtn.classList.remove(
                        "is-loading"
                    );

                }

            }
        );


        /* ==================================================
           JSONP
        ================================================== */

        function jsonp(
            url
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    const callbackName =
                        "jsonp_" +
                        Date.now() +
                        "_" +
                        Math.floor(
                            Math.random() *
                            10000
                        );


                    const script =
                        document.createElement(
                            "script"
                        );


                    const timeout =
                        setTimeout(
                            () => {

                                delete window[
                                    callbackName
                                ];


                                script.remove();


                                reject(
                                    new Error(
                                        "Tempo limite excedido"
                                    )
                                );

                            },
                            15000
                        );


                    window[
                        callbackName
                    ] =
                        function (
                            data
                        ) {

                            clearTimeout(
                                timeout
                            );


                            delete window[
                                callbackName
                            ];


                            script.remove();


                            resolve(
                                data
                            );

                        };


                    script.onerror =
                        function () {

                            clearTimeout(
                                timeout
                            );


                            delete window[
                                callbackName
                            ];


                            script.remove();


                            reject(
                                new Error(
                                    "Erro ao acessar o servidor"
                                )
                            );

                        };


                    script.src =
                        url +
                        (
                            url.includes("?")
                                ? "&"
                                : "?"
                        ) +
                        "callback=" +
                        encodeURIComponent(
                            callbackName
                        );


                    document.body.appendChild(
                        script
                    );

                }
            );

        }


        /* ==================================================
           CONVERTE LINK DO GOOGLE DRIVE
           PARA THUMBNAIL
        ================================================== */

        function converterLinkDrive(
            url,
            tamanho = "w2000"
        ) {

            if (!url) {

                return "";

            }


            url =
                String(url).trim();


            let id =
                null;


            /* ------------------------------------------
               /file/d/ID/view
            ------------------------------------------ */

            let match =
                url.match(
                    /drive\.google\.com\/file\/d\/([^\/?]+)/
                );


            if (match) {

                id =
                    match[1];

            }


            /* ------------------------------------------
               ?id=ID
            ------------------------------------------ */

            if (!id) {

                match =
                    url.match(
                        /[?&]id=([^&]+)/
                    );


                if (match) {

                    id =
                        match[1];

                }

            }


            /* ------------------------------------------
               GERA THUMBNAIL
            ------------------------------------------ */

            if (id) {

                return (
                    "https://drive.google.com/thumbnail?id=" +
                    encodeURIComponent(id) +
                    "&sz=" +
                    tamanho
                );

            }


            /* ------------------------------------------
               SE NÃO FOR DRIVE
            ------------------------------------------ */

            return url;

        }


        /* ==================================================
           CARREGA VIATURAS
        ================================================== */

        let consultaViaturasCarregadas =
            false;


        let viaturasCarregadas =
            null;


        let carregandoViaturas =
            null;


        async function carregarViaturas() {

            /* ------------------------------------------
               JÁ CARREGOU
            ------------------------------------------ */

            if (
                viaturasCarregadas
            ) {

                preencherViaturas(
                    viaturasCarregadas
                );


                return viaturasCarregadas;

            }


            /* ------------------------------------------
               SOLICITAÇÃO EM ANDAMENTO
            ------------------------------------------ */

            if (
                carregandoViaturas
            ) {

                return carregandoViaturas;

            }


            /* ------------------------------------------
               BUSCA
            ------------------------------------------ */

            carregandoViaturas =
                jsonp(
                    API_URL +
                    "?action=vtr"
                )
                    .then(
                        resposta => {

                            if (
                                resposta.status !==
                                "success"
                            ) {

                                throw new Error(
                                    resposta.message ||
                                    "Erro ao carregar viaturas"
                                );

                            }


                            viaturasCarregadas =
                                resposta.vtrs ||
                                [];


                            preencherViaturas(
                                viaturasCarregadas
                            );


                            return viaturasCarregadas;

                        }
                    )
                    .catch(
                        erro => {

                            console.error(
                                "Erro ao carregar viaturas:",
                                erro
                            );


                            document.getElementById(
                                "viaturaSelect"
                            ).innerHTML =
                                '<option value="">Erro ao carregar</option>' +
                                '<option value="outra">Outra (especificar em obs)</option>';


                            document.getElementById(
                                "viatura"
                            ).innerHTML =
                                '<option value="">Erro ao carregar</option>';


                            throw erro;

                        }
                    );


            return carregandoViaturas;

        }


        /* ==================================================
           PREENCHE OS DOIS SELECTS
        ================================================== */

        function preencherViaturas(
            vtrs
        ) {

            const selectFormulario =
                document.getElementById(
                    "viaturaSelect"
                );


            const selectConsulta =
                document.getElementById(
                    "viatura"
                );


            /* ------------------------------------------
               FORMULÁRIO
            ------------------------------------------ */

            selectFormulario.innerHTML =
                '<option value="">Selecione a VTR</option>';


            vtrs.forEach(
                vtr => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        vtr;


                    option.textContent =
                        vtr;


                    selectFormulario.appendChild(
                        option
                    );

                }
            );


            selectFormulario.innerHTML +=
                '<option value="outra">Outra (especificar em obs)</option>';


            /* ------------------------------------------
               CONSULTA
            ------------------------------------------ */

            selectConsulta.innerHTML =
                '<option value="">Selecione a viatura...</option>';


            vtrs.forEach(
                vtr => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        vtr;


                    option.textContent =
                        vtr;


                    selectConsulta.appendChild(
                        option
                    );

                }
            );


            document.getElementById(
                "status"
            ).textContent =
                vtrs.length +
                " viaturas disponíveis.";

        }


        /* ==================================================
           CONSULTA ABASTECIMENTOS
        ================================================== */

        async function consultar() {

            const viatura =
                document
                    .getElementById(
                        "viatura"
                    )
                    .value
                    .trim();


            const resultado =
                document.getElementById(
                    "resultado"
                );


            const status =
                document.getElementById(
                    "status"
                );


            if (!viatura) {

                resultado.innerHTML =
                    "";


                status.textContent =
                    "Selecione uma viatura.";


                return;

            }


            resultado.innerHTML =
                '<div class="nenhum">' +
                '<i class="fas fa-spinner fa-spin mr-2"></i>' +
                'Consultando...' +
                '</div>';


            status.textContent =
                "Buscando os últimos registros...";


            try {

                const url =
                    API_URL +
                    "?action=abastecimentos" +
                    "&viatura=" +
                    encodeURIComponent(
                        viatura
                    );


                const resposta =
                    await jsonp(
                        url
                    );


                if (
                    resposta.status !==
                    "success"
                ) {

                    throw new Error(
                        resposta.message ||
                        "Erro na consulta"
                    );

                }


                mostrarResultados(
                    resposta.registros
                );


                status.textContent =
                    resposta.registros.length +
                    " registro(s) encontrado(s).";

            }
            catch (erro) {

                console.error(
                    erro
                );


                resultado.innerHTML =
                    '<div class="nenhum">' +
                    '<i class="fas fa-triangle-exclamation mr-2"></i>' +
                    'Erro ao realizar consulta.' +
                    '</div>';


                status.textContent =
                    erro.message;

            }

        }


        /* ==================================================
           MOSTRA RESULTADOS
        ================================================== */

        function mostrarResultados(
            registros
        ) {

            const container =
                document.getElementById(
                    "resultado"
                );


            if (
                !registros ||
                registros.length === 0
            ) {

                container.innerHTML =
                    '<div class="nenhum">' +
                    '<i class="fas fa-inbox mr-2"></i>' +
                    'Nenhum abastecimento encontrado para esta viatura.' +
                    '</div>';


                return;

            }


            container.innerHTML =
                "";


            registros.forEach(
                registro => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "registro";


                    /* ==========================================
                       VIATURA
                    ========================================== */

                    const viatura =
                        document.createElement(
                            "div"
                        );


                    viatura.className =
                        "campo-viatura";


                    viatura.innerHTML =
                        '<span class="label">' +
                        '<i class="fas fa-car-side mr-1"></i>' +
                        'Viatura' +
                        '</span>' +

                        '<span class="valor">' +
                        escaparHTML(
                            registro.viatura
                        ) +
                        '</span>';


                    /* ==========================================
                       OBSERVAÇÃO
                    ========================================== */

                    const obs =
                        document.createElement(
                            "div"
                        );


                    obs.className =
                        "campo-obs";


                    obs.innerHTML =
                        '<span class="label">' +
                        '<i class="fas fa-comment-alt mr-1"></i>' +
                        'Observação' +
                        '</span>' +

                        '<span class="valor">' +

                        (
                            registro.obs
                                ? escaparHTML(
                                    registro.obs
                                )
                                : "—"
                        ) +

                        '</span>';


                    /* ==========================================
                       DATA / HORA
                    ========================================== */

                    const timestamp =
                        document.createElement(
                            "div"
                        );


                    timestamp.className =
                        "campo-data";


                    /*
                     * O Apps Script já entrega o timestamp
                     * formatado no fuso de São Paulo.
                     *
                     * Não usamos new Date() aqui,
                     * evitando uma nova conversão de fuso.
                     */

                    timestamp.innerHTML =
                        '<span class="label">' +
                        '<i class="fas fa-clock mr-1"></i>' +
                        'Data / Hora' +
                        '</span>' +

                        '<span class="valor data">' +
                        escaparHTML(
                            registro.timestamp
                        ) +
                        '</span>';


                    /* ==========================================
                       IMAGEM
                    ========================================== */

                    const arquivo =
                        document.createElement(
                            "div"
                        );


                    arquivo.className =
                        "campo-imagem";


                    if (
                        registro.fileLink
                    ) {

                        const img =
                            document.createElement(
                                "img"
                            );


                        img.className =
                            "thumb";


                        const imagemUrl =
                            converterLinkDrive(
                                registro.fileLink,
                                "w1000"
                            );


                        img.src =
                            imagemUrl;


                        img.alt =
                            "Imagem do abastecimento";


                        img.loading =
                            "lazy";


                        img.onclick =
                            function () {

                                abrirImagem(
                                    registro.fileLink
                                );

                            };


                        img.onerror =
                            function () {

                                img.style.display =
                                    "none";


                                const erro =
                                    document.createElement(
                                        "div"
                                    );


                                erro.className =
                                    "sem-imagem";


                                erro.innerHTML =
                                    '<i class="fas fa-image-slash mr-1"></i>' +
                                    'Imagem indisponível';


                                arquivo.appendChild(
                                    erro
                                );

                            };


                        arquivo.appendChild(
                            img
                        );

                    }
                    else {

                        arquivo.innerHTML =
                            '<div class="sem-imagem">' +

                            '<i class="fas fa-image mr-1"></i>' +

                            'Sem imagem' +

                            '</div>';

                    }


                    /* ==========================================
                       MONTA O CARD
                    ========================================== */

                    div.appendChild(
                        viatura
                    );


                    div.appendChild(
                        obs
                    );


                    div.appendChild(
                        timestamp
                    );


                    div.appendChild(
                        arquivo
                    );


                    container.appendChild(
                        div
                    );

                }
            );

        }


        /* ==================================================
           ABRE IMAGEM
        ================================================== */

        function abrirImagem(
            url
        ) {

            const imagemUrl =
                converterLinkDrive(
                    url,
                    "w2000"
                );


            const imagemGrande =
                document.getElementById(
                    "imagemGrande"
                );


            imagemGrande.src =
                imagemUrl;


            document
                .getElementById(
                    "modal"
                )
                .classList.add(
                    "aberto"
                );

        }


        /* ==================================================
           FECHA IMAGEM
        ================================================== */

        function fecharImagem() {

            document
                .getElementById(
                    "modal"
                )
                .classList.remove(
                    "aberto"
                );


            document
                .getElementById(
                    "imagemGrande"
                )
                .src =
                "";

        }


        /* ==================================================
           ESC FECHA MODAL
        ================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    fecharImagem();

                }

            }
        );


        /* ==================================================
           SEGURANÇA BÁSICA
        ================================================== */

        function escaparHTML(
            valor
        ) {

            return String(
                valor || ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==================================================
           INICIALIZAÇÃO
        ================================================== */

        carregarViaturas();


    </script>
